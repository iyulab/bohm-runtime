name: CLA

on:
  pull_request:
    types: [opened, synchronize, reopened]

# The check only reads a file out of the checked-out tree, so it needs nothing else. No write
# scope, no personal access token, no third-party action: the industry-standard one
# (cla-assistant) is archived and unmaintained, and its lite action wants both a PAT and
# pull_request_target.
permissions:
  contents: read

concurrency:
  group: cla-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signature:
    name: signature on record
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Check for a CLA signature
        env:
          LOGIN: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          USER_TYPE: ${{ github.event.pull_request.user.type }}
        # Invoked through `bash` rather than executed directly: the repository is developed on
        # Windows, where git does not track the executable bit, so relying on it would fail every
        # pull request — including the exempt ones — with "Permission denied".
        run: bash .github/scripts/check-cla.sh
